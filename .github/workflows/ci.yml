name: CI

# Runs on pull requests and on every branch except main. main is gated by the
# same checks through deploy.yml (workflow_call) before anything is built.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Lint, static analysis & tests
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # mongodb is PINNED to 1.21.x: composer.lock holds mongodb/mongodb 1.21.x,
          # which requires ext-mongodb ^1.21 (the unpinned latest is 2.x and fails
          # composer's platform check). Matches the locally tested version.
          extensions: mongodb-1.21.2, redis, gd, exif, intl, zip, bcmath, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install JS dependencies & build assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          # phpunit.xml points the media DB at a real file (never :memory:).
          touch database/media_test.sqlite

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: PHPStan (level 6)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Pest
        run: vendor/bin/pest
