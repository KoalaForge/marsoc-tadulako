[PHP]
expose_php = Off

; Resource limits — banners/photos are uploaded through Filament (8 MB banner
; limit, 5 MB inline images), so keep headroom above the app's own caps.
memory_limit = 512M
max_execution_time = 60
max_input_time = 60
post_max_size = 50M
upload_max_filesize = 40M
max_file_uploads = 20

date.timezone = Asia/Jakarta

realpath_cache_size = 32M
realpath_cache_ttl = 600

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax
session.use_only_cookies = 1

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; A deploy replaces the whole container, so files never change underneath it.
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.file_update_protection = 0
opcache.file_cache = /tmp/opcache-file-cache
