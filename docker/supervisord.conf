[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
logfile_maxbytes=10MB
logfile_backups=3

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

; ── Web (FrankenPHP) ─────────────────────────────────────────────────────────
[program:frankenphp]
command=frankenphp run --config /etc/caddy/Caddyfile
autostart=true
autorestart=true
priority=1
startsecs=5
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

; ── Queue worker: medialibrary image conversions run on the `media` queue ───
[program:queue-worker]
process_name=%(program_name)s
command=php /app/artisan queue:work redis --queue=media,default --sleep=1 --tries=3 --timeout=120 --max-time=3600
directory=/app
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=SIGTERM
stopwaitsecs=130
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
